services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openoa

  openoa:
    build: .
    # Ports removed from host to enforce access via Nginx only
    # ports:
    #   - "8888:8888"
    volumes:
      - .:/app
    command: jupyter lab --ip=0.0.0.0 --allow-root --no-browser --IdentityProvider.token=openoa
